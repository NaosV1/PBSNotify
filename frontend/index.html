<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PBS Notify - Notifications de sauvegarde Proxmox">
  <meta name="theme-color" content="#ffffff">
  <title>PBS Notify</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Styles -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h1>PBS Notify</h1>
        <p class="subtitle">Notifications de sauvegarde Proxmox</p>
      </div>
      <a href="/admin" class="btn" style="text-decoration: none; font-size: 14px; padding: 8px 16px;">Administration</a>
    </header>

    <main>
      <!-- Notifications Control -->
      <section class="card">
        <h2>Notifications Push</h2>
        <div class="status-message" id="subscription-status">Chargement...</div>
        <button id="subscribe-btn" class="btn" disabled>
          Activer les notifications
        </button>
      </section>

      <!-- Statistics -->
      <section class="card">
        <h2>Statistiques</h2>
        <div class="stats">
          <div class="stat">
            <div class="stat-value" id="total-notifications">—</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat success">
            <div class="stat-value" id="success-count">—</div>
            <div class="stat-label">Succès</div>
          </div>
          <div class="stat error">
            <div class="stat-value" id="error-count">—</div>
            <div class="stat-label">Erreurs</div>
          </div>
        </div>
      </section>

      <!-- History -->
      <section class="card">
        <div class="card-header">
          <h2>Historique</h2>
          <button id="refresh-btn" class="btn-refresh" title="Actualiser">↻</button>
        </div>
        <div id="notifications-list" class="notifications">
          <div class="loading">Chargement des notifications...</div>
        </div>
      </section>
    </main>

    <footer>
      <p>PBS Notify v1.0 · <a href="https://github.com/NaosV1/PBSNotify" target="_blank">GitHub</a> · <a href="/admin">Administration</a></p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
