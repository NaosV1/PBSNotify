version: '3.8'

services:
  pbs-notify:
    build: .
    container_name: pbs-notify
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/backend/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/backend/data
      # Les clés VAPID doivent être définies via un fichier .env
      # ou en ligne de commande lors du lancement
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      # Secret JWT pour l'authentification
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
